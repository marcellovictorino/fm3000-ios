# The iPhone app's Xcode project, generated by XcodeGen (scripts/generate-project.sh).
# The code lives in the Swift package (Package.swift); this project is only the app shell.
name: FM3000
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FM3000:
    path: .
targets:
  FM3000:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FM3000
        product: FM3000UI
      - package: FM3000
        product: FM3000Model
      - package: FM3000
        product: FM3000Core
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Infinitary
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Infinitary connects to your Mac, which may be on your local network.
        NSCameraUsageDescription: Take a photo to attach to a message for your Mac.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a message for your Mac.
        NSMicrophoneUsageDescription: "Dictate a message: your speech is turned into text on this phone."
        NSSpeechRecognitionUsageDescription: Turn what you say into text for a message to your Mac.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: join
            CFBundleURLSchemes: [infinitary, firstmate3000]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${FM3000_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${FM3000_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FM3000:
    build:
      targets:
        FM3000: all
    run:
      config: Debug
    archive:
      config: Release
